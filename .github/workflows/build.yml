name: Build Psiphon Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          msbuild src\psiclient2015.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Find EXE
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.exe |
            Where-Object {
              $_.Name -ne "psiphon-tunnel-core.exe"
            } |
            Select-Object FullName

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Psiphon-Windows-x64
          path: |
            **/Release/*.exe
            **/x64/Release/*.exe
          if-no-files-found: warn
