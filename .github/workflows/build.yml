name: Build Psiphon Windows

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install VS2015 C++ Build Tools
        shell: pwsh
        run: |
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"

          Write-Host "Installing MSVC v140..."

          & $vsInstaller modify `
            --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
            --add Microsoft.VisualStudio.Component.VC.140 `
            --quiet `
            --wait `
            --norestart

          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 3010) {
            throw "VS Installer failed with exit code $LASTEXITCODE"
          }

      - name: Verify v140
        shell: pwsh
        run: |
          $path = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC"
          Get-ChildItem $path -Directory | Select-Object Name

      - name: Prepare embeddedvalues.h
        shell: pwsh
        run: |
          Copy-Item src\embeddedvalues.h.stub src\embeddedvalues.h

      - name: Build
        shell: cmd
        run: |
          msbuild src\psiclient2015.sln /m /p:Configuration=Release

      - name: Find EXE
        shell: pwsh
        run: |
          Write-Host "Searching for built EXE files..."

          Get-ChildItem -Recurse -Filter *.exe |
            Where-Object {
              $_.Name -ne "psiphon-tunnel-core.exe"
            } |
            Select-Object FullName

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Psiphon-Windows-Custom
          path: |
            **/Release/*.exe
            **/Release/**/*.exe
          if-no-files-found: warn
